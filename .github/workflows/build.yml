# Baut den Windows-Installer, damit dafür kein Windows-Rechner nötig ist.
# Der Runner von GitHub bringt Build Tools und WebView2 schon mit — genau die
# beiden Dinge, die von Hand eingerichtet werden müssten (siehe BUILD-WINDOWS.md).
name: build

on:
  # Von Hand auslösen: Actions ▸ build ▸ Run workflow.
  workflow_dispatch:
  # Ein Versionsschild baut ebenfalls — und veröffentlicht ein Release.
  push:
    tags:
      - "v*"

# Schreibrecht, weil der letzte Schritt bei einem Versionsschild ein Release
# anlegt. Für einen Lauf von Hand bleibt es ungenutzt.
permissions:
  contents: write

# Die Actions hängen an ihrem Commit, nicht am wandernden Versionsschild: mit
# `contents: write` im selben Bauplan hätte eine übernommene Action Schreibrecht
# auf die Releases. Dependabot hält die SHAs nach (.github/dependabot.yml).

jobs:
  # Läuft vor dem Bau und auf Linux, weil beides dort in einer Minute erledigt
  # ist. Vorher liefen die Tests überhaupt nicht in CI — es gab sie, aber nur
  # von Hand. Ein roter Test soll kein Release erzeugen.
  pruefen:
    name: Tests und Abhängigkeiten
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # Tauri braucht unter Linux GTK und WebKit, sonst scheitert schon das
      # Übersetzen der Tests.
      - name: Tauri-Voraussetzungen
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - run: npm ci

      # Prüft die Oberfläche und die Prüfsummen der mitgelieferten
      # Bibliotheken. Beim Bau ruft `beforeBuildCommand` dasselbe Skript auf;
      # hier steht es, damit ein Lauf ohne Bau denselben Befund liefert.
      - run: npm run check

      - name: Tests
        working-directory: src-tauri
        run: cargo test

      # Sagt, ob in den knapp 500 Kisten hinter `tauri` eine bekannte Lücke
      # steckt. Docfill hat keinen Updater: was hier durchrutscht, bleibt auf
      # den Rechnern, bis jemand den Installer von Hand neu holt.
      - name: cargo audit
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked
          cargo audit

      # `npm audit` deckt nur die Bauwerkzeuge ab — die Oberfläche bringt ihre
      # Bibliotheken als Datei mit. Deshalb ein Hinweis, kein Abbruch.
      - name: npm audit (nur Bauwerkzeuge)
        continue-on-error: true
        run: npm audit --audit-level=high

  windows:
    name: Windows-Installer
    runs-on: windows-latest
    needs: pruefen

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Das Schild und die Version in tauri.conf.json müssen zusammenpassen,
      # sonst heißt die Datei im Release `Docfill_0.1.0_x64-setup.exe`, obwohl
      # das Schild v0.2.0 verspricht. Lieber gleich hier abbrechen als nach
      # zwanzig Minuten Bauzeit. package.json wird mitgeprüft: sie benennt zwar
      # keine Datei, aber eine Fassung, die an zwei Stellen verschieden steht,
      # ist beim nächsten Nachsehen eine Fehlerquelle.
      - name: Version prüfen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $conf) {
            throw "Schild $tag passt nicht zur Version $conf in src-tauri/tauri.conf.json"
          }
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) {
            throw "Schild $tag passt nicht zur Version $pkg in package.json"
          }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      # Ohne Zwischenspeicher übersetzt Rust bei jedem Lauf alles neu: 10–20
      # Minuten statt ein bis zwei. Das Crate liegt in src-tauri/, nicht oben.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Derselbe Befehl wie in BUILD-WINDOWS.md, damit Anleitung und Bauplan
      # nicht auseinanderlaufen. `beforeBuildCommand` in tauri.conf.json ruft
      # zuerst scripts/check.mjs auf — ein Fehler in der Oberfläche bricht hier
      # ab, statt einen tadellosen Installer mit kaputter Oberfläche zu liefern.
      - run: npm run build

      # Docfill ist nicht signiert. Ohne Zertifikat sagt Windows nicht, ob eine
      # heruntergeladene Datei die echte ist — die Prüfsumme sagt es. Sie steht
      # im Release neben den Dateien, damit sich beides vergleichen lässt
      # (Anleitung in BUILD-WINDOWS.md).
      - name: Prüfsummen erzeugen
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle"
          $dateien = Get-ChildItem -Path "$bundle/nsis/*-setup.exe", "$bundle/msi/*.msi"
          if (-not $dateien) { throw "Keine Installationsdateien gefunden" }
          $zeilen = foreach ($d in $dateien) {
            $summe = (Get-FileHash $d.FullName -Algorithm SHA256).Hash.ToLower()
            "$summe  $($d.Name)"
          }
          $zeilen | Set-Content -Path "$bundle/SHA256SUMS.txt" -Encoding ascii
          Get-Content "$bundle/SHA256SUMS.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docfill-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/SHA256SUMS.txt
          # Ohne das gilt ein Lauf auch dann als geglückt, wenn das Bündeln
          # still nichts erzeugt hat.
          if-no-files-found: error
          retention-days: 30

      # Nur bei einem Versionsschild: ein Release mit dauerhaftem Download-Link.
      # Das Artefakt oben verfällt nach 30 Tagen und ist nur angemeldet
      # erreichbar — ein Release-Anhang bleibt und lässt sich weitergeben.
      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/SHA256SUMS.txt
          # Aus demselben Grund wie oben bei `if-no-files-found`.
          fail_on_unmatched_files: true
          generate_release_notes: true
