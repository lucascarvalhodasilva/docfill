# Baut den Windows-Installer, damit dafür kein Windows-Rechner nötig ist.
# Der Runner von GitHub bringt Build Tools und WebView2 schon mit — genau die
# beiden Dinge, die von Hand eingerichtet werden müssten (siehe BUILD-WINDOWS.md).
name: build

on:
  # Von Hand auslösen: Actions ▸ build ▸ Run workflow.
  workflow_dispatch:
  # Ein Versionsschild baut ebenfalls — und veröffentlicht ein Release.
  push:
    tags:
      - "v*"

# Schreibrecht, weil der letzte Schritt bei einem Versionsschild ein Release
# anlegt. Für einen Lauf von Hand bleibt es ungenutzt.
permissions:
  contents: write

jobs:
  windows:
    name: Windows-Installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Das Schild und die Version in tauri.conf.json müssen zusammenpassen,
      # sonst heißt die Datei im Release `Docfill_0.1.0_x64-setup.exe`, obwohl
      # das Schild v0.2.0 verspricht. Lieber gleich hier abbrechen als nach
      # zwanzig Minuten Bauzeit.
      - name: Version prüfen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $conf) {
            throw "Schild $tag passt nicht zur Version $conf in src-tauri/tauri.conf.json"
          }

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Ohne Zwischenspeicher übersetzt Rust bei jedem Lauf alles neu: 10–20
      # Minuten statt ein bis zwei. Das Crate liegt in src-tauri/, nicht oben.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Derselbe Befehl wie in BUILD-WINDOWS.md, damit Anleitung und Bauplan
      # nicht auseinanderlaufen. `beforeBuildCommand` in tauri.conf.json ruft
      # zuerst scripts/check.mjs auf — ein Fehler in der Oberfläche bricht hier
      # ab, statt einen tadellosen Installer mit kaputter Oberfläche zu liefern.
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: docfill-windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          # Ohne das gilt ein Lauf auch dann als geglückt, wenn das Bündeln
          # still nichts erzeugt hat.
          if-no-files-found: error
          retention-days: 30

      # Nur bei einem Versionsschild: ein Release mit dauerhaftem Download-Link.
      # Das Artefakt oben verfällt nach 30 Tagen und ist nur angemeldet
      # erreichbar — ein Release-Anhang bleibt und lässt sich weitergeben.
      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
          # Aus demselben Grund wie oben bei `if-no-files-found`.
          fail_on_unmatched_files: true
          generate_release_notes: true
