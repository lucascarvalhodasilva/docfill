<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formular</title>
<link rel="stylesheet" href="app.css">
<style>
  /* Ein einspaltiges Fenster: Kopfzeile, scrollende Feldliste, Fußzeile.
     Waagerecht polstert nicht der Rumpf, sondern die scrollende Liste selbst:
     nur so reicht sie bis an den Fensterrand und die Bildlaufleiste sitzt dort,
     statt mitten im Fenster am Rand der 640px-Spalte zu kleben. */
  body { display:flex; flex-direction:column; padding:14px 0; gap:10px; overflow:hidden }
  h2 { font-size:12px; font-weight:600; margin:0 14px; display:flex; align-items:center; gap:6px;
       padding-bottom:9px; border-bottom:1px solid var(--line) }
  h2 .meta { font-weight:400; color:var(--muted) }
  /* max() statt max-width: der Inhalt bleibt auf 640px zentriert, das Polster
     wächst mit dem Fenster, und unter 668px bleiben es die 14px der Kopfzeile. */
  #form { overflow-y:auto; flex:1; min-height:0;
          padding-inline:max(14px, calc((100% - 640px) / 2));
          scrollbar-width:thin; scrollbar-color:var(--field-line) transparent }
  /* Ältere WebKit-Fassungen kennen scrollbar-width nicht; dort die schmale
     Leiste selbst zeichnen. Wo die Norm greift, bleibt es beim Systemverhalten
     (macOS blendet sie ein und aus), deshalb nur im @supports-Zweig. */
  @supports not (scrollbar-width: thin) {
    #form::-webkit-scrollbar { width:11px }
    #form::-webkit-scrollbar-track { background:transparent }
    #form::-webkit-scrollbar-thumb { background:var(--line); border-radius:999px;
                                     border:3px solid transparent; background-clip:content-box }
    #form:hover::-webkit-scrollbar-thumb { background:var(--field-line); background-clip:content-box }
  }

  /* Fußzeile wie im Hauptfenster: gleiche Linie, gleiche Höhe, und die
     Hauptaktion nimmt den freien Platz statt eines Abstandhalters. */
  /* Die Zählung der leeren Felder steht über der Schaltflächenzeile, nicht
     neben ihr: #status trägt dort „Wird ausgefüllt…" und Fehler, die beiden
     würden einander überschreiben. */
  footer { margin:0 14px; padding-top:9px; border-top:1px solid var(--line);
           display:flex; flex-direction:column; gap:8px }
  #leer { color:var(--muted); min-height:1.45em }
  footer .row button { padding-block:7px }
  footer .row .primary { flex:1 }
  .empty { color:var(--muted); display:flex; flex-direction:column; align-items:center; justify-content:center;
           text-align:center; gap:3px; height:100%; min-height:72px; padding:12px; max-width:44ch; margin:0 auto }
  .empty b { color:var(--ink); font-weight:600 }
</style>
</head>
<body>
<h2>Formular<span class="meta" id="formMeta"></span></h2>
<div id="form"></div>
<footer>
  <span id="leer" role="status" aria-live="polite"></span>
  <div class="row"><span id="status" role="status" aria-live="polite"></span>
    <button id="cancel">Abbrechen</button>
    <button id="fill" class="primary" disabled>Ausgewählte Dokumente ausfüllen</button></div>
</footer>

<script type="module">
// Dieses Fenster kennt weder die Dokumente noch JSZip: es zeigt Felder an und
// schickt die eingegebenen Werte zurück. Die Dokumentinhalte bleiben im
// Hauptfenster — sie wären über die IPC-Grenze hinweg viel zu groß.
import { invoke } from "./vendor/tauri-api.js";
import { renderFields, collectValues, emptyText } from "./form-ui.js";

const $ = id => document.getElementById(id);
function setStatus(m, err) { const s = $("status"); s.textContent = m; s.className = err ? "error" : ""; }

let fields = [];
let groupId = null;   // wird unverändert zurückgeschickt, damit das Hauptfenster
                      // weiß, zu welcher Gruppe die Werte gehören

// Werte werden entkoppelt zwischengespeichert, damit sie ein Schließen des
// Fensters überleben und beim erneuten Öffnen wieder dastehen.
let saveTimer = 0;
function cacheNow() {
  zaehleLeer();
  clearTimeout(saveTimer);
  if (!fields.length) return;
  invoke("form_cache_values", { payload: payloadNow() }).catch(() => {});
}
function cacheSoon() { zaehleLeer(); clearTimeout(saveTimer); saveTimer = setTimeout(cacheNow, 300); }

// Wie viele Felder noch leer sind. Hängt an denselben Listenern, die
// ohnehin schon die Werte zwischenspeichern — ein dritter wäre nur eine weitere
// Stelle, die man beim nächsten Umbau vergessen kann.
function zaehleLeer() { $("leer").textContent = emptyText($("form"), fields); }
function payloadNow() {
  return JSON.stringify({ id: groupId, fields, meta: $("formMeta").textContent, values: collectValues($("form"), fields) });
}

async function load() {
  let data;
  try { data = JSON.parse(await invoke("form_payload")); }
  catch { setStatus("Das Formular konnte nicht geladen werden.", true); return; }

  fields = Array.isArray(data.fields) ? data.fields : [];
  groupId = data.id || null;
  $("formMeta").textContent = data.meta || "";
  if (!fields.length) {
    $("form").innerHTML = `<div class="empty"><b>Kein Formular</b>Im Hauptfenster Dokumente auswählen und
      das Formular erneut erstellen.</div>`;
    return;
  }
  renderFields($("form"), fields, data.values || {});
  $("fill").disabled = false;
  zaehleLeer();
  $("form").addEventListener("input", cacheSoon);
  // change und blur sofort sichern: wer direkt danach das Fenster schließt,
  // soll die letzten Eingaben nicht verlieren
  $("form").addEventListener("change", cacheNow);
  addEventListener("blur", cacheNow);
}

async function submit() {
  if ($("fill").disabled) return;
  $("fill").disabled = true;
  $("fill").setAttribute("aria-busy", true);
  setStatus("Wird ausgefüllt…");
  clearTimeout(saveTimer);
  try {
    // Das Hauptfenster füllt die Dokumente und schließt dieses Fenster danach.
    await invoke("form_submit", { payload: payloadNow() });
  } catch (e) {
    setStatus(String(e), true);
    $("fill").disabled = false;
    $("fill").setAttribute("aria-busy", false);
  }
}
// Abbrechen schließt nur das Fenster — dieselbe Wirkung wie das Schließen über
// die Titelleiste. Nichts geht verloren: die Werte werden vorher gesichert und
// stehen beim nächsten Öffnen der Gruppe wieder da. Deshalb auch keine Nachfrage.
function cancel() {
  cacheNow();
  invoke("close_form_window").catch(() => {});
}

$("fill").onclick = submit;
$("cancel").onclick = cancel;
// ⌘↵ / Ctrl+↵ füllt aus — dieselbe Tastenkombination wie früher im Hauptfenster,
// Esc bricht ab, wie in einem Dialog.
addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submit(); }
  else if (e.key === "Escape") { e.preventDefault(); cancel(); }
});

load();
</script>
</body>
</html>
